<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>РАЗБЛОКИРУЙ</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#050505;
 font-family:Arial,sans-serif;
}

body{
 color:white;
}

.screen{
 position:fixed;
 inset:0;
 overflow:hidden;
}

.menu{
 position:absolute;
 inset:0;
 background:
   linear-gradient(
     to bottom,
     rgba(0,0,0,.30),
     rgba(0,0,0,.48)
   ),
   radial-gradient(
     circle at 50% 35%,
     #8b5c28 0%,
     #342116 28%,
     #080807 72%
   );
}

/* декоративный коридор */

.corridor{
 position:absolute;
 inset:0;
 perspective:700px;
 overflow:hidden;
}

.back{
 position:absolute;
 width:54%;
 height:55%;
 left:23%;
 top:22%;
 background:
   linear-gradient(
     90deg,
     #120c08,
     #8b5a28,
     #24150c
   );
 box-shadow:
   0 0 80px rgba(255,160,55,.25);
}

.door{
 position:absolute;
 width:39%;
 height:43%;
 left:30.5%;
 top:28%;
 background:
   linear-gradient(
     90deg,
     #241308,
     #9a6330 45%,
     #3a1e0c
   );
 border:10px solid #201209;
 box-shadow:
   0 20px 50px #000,
   inset 0 0 30px rgba(0,0,0,.8);
}

.door:before{
 content:"";
 position:absolute;
 inset:9%;
 border:2px solid rgba(255,210,140,.45);
}

.door:after{
 content:"";
 position:absolute;
 width:10px;
 height:60px;
 right:9%;
 top:48%;
 border-radius:8px;
 background:#d9b16d;
 box-shadow:0 0 10px #d9b16d;
}

.light{
 position:absolute;
 width:18px;
 height:160px;
 top:25%;
 background:#ffc978;
 filter:blur(8px);
 opacity:.75;
}

.light.left{
 left:8%;
}

.light.right{
 right:8%;
}

.plant{
 position:absolute;
 bottom:18%;
 width:80px;
 height:170px;
}

.plant.left{
 left:4%;
}

.plant.right{
 right:4%;
}

.pot{
 position:absolute;
 bottom:0;
 left:15px;
 width:50px;
 height:65px;
 background:linear-gradient(90deg,#111,#44301f,#111);
 border-radius:4px;
}

.leaf{
 position:absolute;
 width:25px;
 height:80px;
 border-radius:100% 0 100% 0;
 background:linear-gradient(#315f2a,#101f0d);
 transform-origin:bottom;
}

.l1{left:15px;bottom:45px;transform:rotate(-30deg)}
.l2{left:30px;bottom:50px;transform:rotate(10deg)}
.l3{left:42px;bottom:43px;transform:rotate(35deg)}
.l4{left:20px;bottom:80px;transform:rotate(-50deg)}
.l5{left:40px;bottom:78px;transform:rotate(45deg)}

.floor{
 position:absolute;
 left:-30%;
 width:160%;
 height:48%;
 bottom:-23%;
 background:
   repeating-linear-gradient(
     90deg,
     #19120e 0,
     #19120e 90px,
     #0c0907 92px
   );
 transform:rotateX(55deg);
 box-shadow:0 -20px 70px #000;
}

/* контент */

.content{
 position:absolute;
 inset:0;
 z-index:5;
 display:flex;
 flex-direction:column;
 align-items:center;
}

.title{
 margin-top:8vh;
 text-align:center;
 font-weight:900;
 font-size:clamp(42px,11vw,78px);
 letter-spacing:2px;
 line-height:.9;
 color:#f5e4c2;
 text-shadow:
   0 3px 0 #79552f,
   0 8px 25px #000;
}

.subtitle{
 margin-top:16px;
 font-size:clamp(12px,3.5vw,20px);
 letter-spacing:2px;
 font-weight:bold;
 color:#e5c995;
 text-shadow:0 3px 8px #000;
}

.play{
 position:absolute;
 bottom:25%;
 width:68%;
 max-width:390px;
 height:76px;
 border-radius:18px;
 border:2px solid #d89b36;
 background:
   linear-gradient(
     #f2b64e,
     #a95f0d
   );
 color:white;
 font-size:27px;
 font-weight:900;
 letter-spacing:2px;
 text-shadow:0 2px 4px #70400b;
 box-shadow:
   0 10px 35px rgba(0,0,0,.7),
   inset 0 2px 0 rgba(255,255,255,.35);
}

.play:active{
 transform:scale(.97);
}

.buttons{
 position:absolute;
 bottom:5%;
 width:92%;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
}

.menuBtn{
 height:92px;
 border-radius:16px;
 border:1px solid rgba(255,255,255,.25);
 background:
   linear-gradient(
     rgba(45,48,51,.85),
     rgba(10,11,13,.92)
   );
 color:white;
 font-weight:bold;
 font-size:11px;
 box-shadow:0 8px 25px #000;
}

.icon{
 display:block;
 font-size:31px;
 margin-bottom:7px;
}

.menuBtn:active{
 transform:scale(.95);
}

/* игра */

#game{
 display:none;
 position:absolute;
 inset:0;
 background:#050505;
}

#back{
 position:absolute;
 top:15px;
 left:15px;
 z-index:20;
 width:55px;
 height:45px;
 border-radius:12px;
 border:1px solid #777;
 background:#111a;
 color:white;
 font-size:24px;
}

#levelText{
 position:absolute;
 z-index:20;
 top:20px;
 right:18px;
 font-weight:bold;
}

canvas{
 display:block;
}

/* popup */

.popup{
 display:none;
 position:absolute;
 inset:0;
 z-index:100;
 background:#000b;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.box{
 width:100%;
 max-width:360px;
 padding:25px;
 border-radius:20px;
 background:linear-gradient(145deg,#292d32,#0d0f11);
 border:1px solid #666;
 text-align:center;
 box-shadow:0 20px 70px #000;
}

.box input{
 width:100%;
 padding:14px;
 margin:10px 0;
 border-radius:10px;
 border:1px solid #666;
 background:#050607;
 color:#62ff9a;
 text-align:center;
 font-size:24px;
 letter-spacing:8px;
}

.box button{
 width:100%;
 min-height:48px;
 margin-top:8px;
 border-radius:12px;
 border:1px solid #777;
 background:#22272c;
 color:white;
 font-weight:bold;
}

@media(max-height:700px){
 .title{margin-top:5vh}
 .play{bottom:23%;height:65px}
 .buttons{bottom:3%}
 .menuBtn{height:75px}
}
</style>
</head>

<body>

<div class="screen" id="menu">

 <div class="menu">

  <div class="corridor">

   <div class="back"></div>

   <div class="door"></div>

   <div class="light left"></div>
   <div class="light right"></div>

   <div class="plant left">
    <div class="leaf l1"></div>
    <div class="leaf l2"></div>
    <div class="leaf l3"></div>
    <div class="leaf l4"></div>
    <div class="leaf l5"></div>
    <div class="pot"></div>
   </div>

   <div class="plant right">
    <div class="leaf l1"></div>
    <div class="leaf l2"></div>
    <div class="leaf l3"></div>
    <div class="leaf l4"></div>
    <div class="leaf l5"></div>
    <div class="pot"></div>
   </div>

   <div class="floor"></div>

  </div>

  <div class="content">

   <div class="title">
    РАЗБЛОКИРУЙ
   </div>

   <div class="subtitle">
    РЕШАЙ ЗАГАДКИ • ОТКРЫВАЙ ДВЕРИ
   </div>

   <button class="play" onclick="startGame()">
    ИГРАТЬ
   </button>

   <div class="buttons">

    <button class="menuBtn" onclick="settings()">
     <span class="icon">⚙️</span>
     НАСТРОЙКИ
    </button>

    <button class="menuBtn" onclick="levels()">
     <span class="icon">▥</span>
     УРОВНИ
    </button>

    <button class="menuBtn" onclick="shop()">
     <span class="icon">🛒</span>
     МАГАЗИН
    </button>

    <button class="menuBtn" onclick="achievements()">
     <span class="icon">👑</span>
     ДОСТИЖЕНИЯ
    </button>

   </div>

  </div>

 </div>

</div>


<div id="game">

 <button id="back" onclick="backMenu()">‹</button>

 <div id="levelText">
  УРОВЕНЬ 1 / 100 ❤️❤️❤️
 </div>

</div>


<div class="popup" id="popup">

 <div class="box">

  <div id="popupText"></div>

  <button onclick="closePopup()">
   ЗАКРЫТЬ
  </button>

 </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;
let door3D;

function startGame(){

 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";

 init3D();
}


/* =========================
   3D LEVEL
========================= */

function init3D(){

 scene=new THREE.Scene();

 scene.background=new THREE.Color(0x17120d);

 scene.fog=new THREE.Fog(
  0x17120d,
  4,
  16
 );


 camera=new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  .1,
  100
 );

 camera.position.set(
  0,
  1.7,
  5
 );


 renderer=new THREE.WebGLRenderer({
  antialias:true
 });

 renderer.setSize(
  innerWidth,
  innerHeight
 );

 renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
 );

 renderer.shadowMap.enabled=true;

 document
  .getElementById("game")
  .appendChild(renderer.domElement);


 /* LIGHT */

 const ambient=
  new THREE.AmbientLight(
   0xffd7a0,
   1
  );

 scene.add(ambient);


 const light=
  new THREE.PointLight(
   0xffb75b,
   8,
   12
  );

 light.position.set(
  0,
  4,
  1
 );

 light.castShadow=true;

 scene.add(light);


 /* FLOOR */

 const floor=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    12,.15,12
   ),
   new THREE.MeshStandardMaterial({
    color:0x29221b,
    roughness:.35,
    metalness:.1
   })
  );

 floor.position.y=-.1;
 floor.receiveShadow=true;

 scene.add(floor);


 /* BACK WALL */

 const wall=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    12,5,.25
   ),
   new THREE.MeshStandardMaterial({
    color:0x4a3726,
    roughness:.8
   })
  );

 wall.position.set(
   0,2.5,-2
  );

 scene.add(wall);


 /* DOOR FRAME */

 const frame=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    3.8,4.4,.45
   ),
   new THREE.MeshStandardMaterial({
    color:0x17120e,
    roughness:.5
   })
  );

 frame.position.set(
   0,2.2,-1.72
  );

 frame.castShadow=true;

 scene.add(frame);


 /* REAL DOOR */

 door3D=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    3.15,3.9,.18
   ),
   new THREE.MeshStandardMaterial({
    color:0x70421e,
    roughness:.38,
    metalness:.08
   })
  );

 door3D.position.set(
   0,2,-1.48
  );

 door3D.castShadow=true;

 scene.add(door3D);


 /* DOOR PANELS */

 for(let y of [.7,2,3.3]){

  const panel=
   new THREE.Mesh(
    new THREE.BoxGeometry(
     2.5,.75,.04
    ),
    new THREE.MeshStandardMaterial({
     color:0x4a2812,
     roughness:.45
    })
   );

  panel.position.set(
   0,y,-1.37
  );

  scene.add(panel);

 }


 /* HANDLE */

 const handle=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .06,.06,.7,20
   ),
   new THREE.MeshStandardMaterial({
    color:0xd6a75e,
    metalness:.8,
    roughness:.2
   })
  );

 handle.rotation.z=Math.PI/2;

 handle.position.set(
   1.05,2,-1.35
  );

 scene.add(handle);


 /* PLANTS */

 createPlant(-3.7,.3);
 createPlant(3.7,.3);


 /* LOOP */

 animate();
}


function createPlant(x,z){

 const pot=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .35,.45,.7,20
   ),
   new THREE.MeshStandardMaterial({
    color:0x181818,
    roughness:.65
   })
  );

 pot.position.set(
   x,.35,z
  );

 scene.add(pot);


 for(let i=0;i<7;i++){

  const leaf=
   new THREE.Mesh(
    new THREE.SphereGeometry(
     .18,.15,.45
    ),
    new THREE.MeshStandardMaterial({
     color:0x24451d,
     roughness:.8
    })
   );

  leaf.scale.y=2;

  leaf.position.set(
   x+(Math.random()-.5)*.6,
   1+i*.18,
   z+(Math.random()-.5)*.4
  );

  scene.add(leaf);
 }
}


function animate(){

 requestAnimationFrame(animate);

 renderer.render(
  scene,
  camera
 );
}


function backMenu(){

 document.getElementById("game").style.display="none";
 document.getElementById("menu").style.display="block";

}


/* MENU */

function showMessage(title,text){

 document.getElementById("popupText").innerHTML=
  "<h2>"+title+"</h2><p>"+text+"</p>";

 document.getElementById("popup").style.display="flex";
}

function closePopup(){

 document.getElementById("popup").style.display="none";

}

function settings(){

 showMessage(
  "⚙️ НАСТРОЙКИ",
  "Звук: ВКЛ<br>Музыка: ВКЛ<br>Язык: Русский"
 );

}

function levels(){

 showMessage(
  "▥ УРОВНИ",
  "🔓 Уровень 1<br><br>🔒 Уровни 2–100"
 );

}

function shop(){

 showMessage(
  "🛒 МАГАЗИН",
  "Скоро здесь появятся подсказки, ключи и специальные предметы."
 );

}

function achievements(){

 showMessage(
  "👑 ДОСТИЖЕНИЯ",
  "🏆 Первое открытие<br>🔐 Мастер кодов<br>🚪 Побег"
 );

}

window.addEventListener(
 "resize",
 ()=>{
  if(!camera)return;

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);

</script>

</body>
</html>
