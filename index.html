<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>UNLOCK ROOM</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050403;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100%;
    max-width:520px;
    height:100vh;
    margin:auto;
    overflow:hidden;
    background:#050403;
}

/* КОМНАТА */
#room{
    position:absolute;
    inset:0;
    background-image:url("room.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* лёгкое затемнение снизу */
#room:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:25%;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.85)
    );
    pointer-events:none;
}

/* =========================
   ВЕРХНИЙ HUD
========================= */

#top{
    position:absolute;
    z-index:20;
    top:18px;
    left:18px;
    right:18px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

#back{
    width:62px;
    height:62px;

    border:2px solid #c9a45a;
    border-radius:20px;

    background:rgba(10,7,5,.88);
    color:white;

    font-size:38px;
    line-height:1;
}

#level{
    padding:17px 25px;

    border:2px solid #9c722e;
    border-radius:28px;

    background:rgba(12,8,5,.9);

    color:#f2d68e;
    font-size:21px;
    font-weight:800;

    box-shadow:0 5px 20px rgba(0,0,0,.5);
}

#lives{
    font-size:27px;
    letter-spacing:-5px;
    white-space:nowrap;
}

/* =========================
   НЕВИДИМЫЕ ЗОНЫ
========================= */

.hotspot{
    position:absolute;
    z-index:10;

    border:0;
    background:transparent;

    cursor:pointer;
}

/* картина */
#picture{
    left:0;
    top:22%;
    width:25%;
    height:28%;
}

/* часы */
#clock{
    right:0;
    top:20%;
    width:28%;
    height:24%;
}

/* лампа */
#lamp{
    left:0;
    bottom:31%;
    width:23%;
    height:23%;
}

/* записка */
#note{
    left:0;
    bottom:25%;
    width:29%;
    height:15%;
}

/* клавиатура */
#keypad{
    right:12%;
    top:39%;
    width:20%;
    height:27%;
}

/* =========================
   НИЖНЯЯ ПАНЕЛЬ
========================= */

#bottom{
    position:absolute;
    z-index:20;

    left:18px;
    right:18px;
    bottom:18px;

    display:flex;
    gap:8px;
}

.slot{
    width:72px;
    height:66px;

    border:2px solid #9c722e;
    border-radius:20px;

    background:rgba(10,6,4,.9);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:29px;
}

#hint{
    flex:1;

    height:66px;

    border:2px solid #9c722e;
    border-radius:20px;

    background:rgba(10,6,4,.92);

    color:#f2d68e;

    font-size:17px;
    font-weight:800;
}

/* =========================
   ОКНО
========================= */

.overlay{
    display:none;

    position:absolute;
    z-index:50;

    inset:0;

    background:rgba(0,0,0,.78);

    align-items:center;
    justify-content:center;

    padding:22px;
}

.card{
    width:100%;
    max-width:360px;

    padding:25px;

    border:2px solid #b7893b;
    border-radius:25px;

    background:#120b06;

    color:#fff;

    text-align:center;

    box-shadow:0 20px 60px #000;
}

.card h2{
    margin:0 0 12px;

    color:#f2d68e;

    font-size:24px;
}

.card p{
    font-size:18px;
    line-height:1.5;
}

.card button{
    margin-top:10px;

    padding:13px 25px;

    border:1px solid #b7893b;
    border-radius:14px;

    background:#211309;

    color:#f2d68e;

    font-size:16px;
    font-weight:bold;
}

/* =========================
   КЛАВИАТУРА
========================= */

#keypadWindow{
    display:none;

    position:absolute;
    z-index:60;

    inset:0;

    background:rgba(0,0,0,.8);

    align-items:center;
    justify-content:center;
}

.keypadBox{
    width:290px;

    padding:20px;

    border:2px solid #b7893b;
    border-radius:25px;

    background:#110a06;
}

#display{
    height:55px;

    margin-bottom:12px;

    border:1px solid #77531e;
    border-radius:12px;

    background:#050403;

    color:#f4d98f;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;
    letter-spacing:8px;
}

.keys{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.keys button{
    height:52px;

    border:1px solid #76521d;
    border-radius:12px;

    background:#21140a;

    color:white;

    font-size:20px;
}

.keys .open{
    grid-column:span 3;

    background:#72501a;
    color:#ffe5a0;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

    <!-- ТОЛЬКО ФОН -->
    <div id="room"></div>

    <!-- HUD -->
    <div id="top">

        <button id="back" onclick="location.reload()">
            ‹
        </button>

        <div id="level">
            УРОВЕНЬ 1 / 100
        </div>

        <div id="lives">
            ❤️❤️❤️
        </div>

    </div>


    <!-- ИНТЕРАКТИВНЫЕ ПРЕДМЕТЫ -->

    <button
        class="hotspot"
        id="picture"
        onclick="showInfo(
        'КАРТИНА',
        'На картине спрятана первая цифра:<br><br><b>7</b>'
        )">
    </button>


    <button
        class="hotspot"
        id="clock"
        onclick="showInfo(
        'ЧАСЫ',
        'Время на часах даёт вторую цифру:<br><br><b>2</b>'
        )">
    </button>


    <button
        class="hotspot"
        id="lamp"
        onclick="showInfo(
        'ЛАМПА',
        'Под лампой находится цифра:<br><br><b>9</b>'
        )">
    </button>


    <button
        class="hotspot"
        id="note"
        onclick="showInfo(
        'ЗАПИСКА',
        'На записке написано:<br><br>Начни с 7, затем 2, потом 9.<br>Последняя цифра — <b>4</b>.'
        )">
    </button>


    <button
        class="hotspot"
        id="keypad"
        onclick="openKeypad()">
    </button>


    <!-- НИЖНЯЯ ПАНЕЛЬ -->

    <div id="bottom">

        <div class="slot">
            🎒
        </div>

        <div class="slot"></div>

        <div class="slot"></div>

        <div class="slot"></div>

        <button id="hint" onclick="showHint()">
            💡 ПОДСКАЗКА
        </button>

    </div>


    <!-- ИНФО -->

    <div class="overlay" id="infoWindow">

        <div class="card">

            <h2 id="infoTitle"></h2>

            <p id="infoText"></p>

            <button onclick="closeInfo()">
                ПОНЯТНО
            </button>

        </div>

    </div>


    <!-- КЛАВИАТУРА -->

    <div id="keypadWindow">

        <div class="keypadBox">

            <div id="display">
                ____
            </div>

            <div class="keys">

                <button onclick="press('1')">1</button>
                <button onclick="press('2')">2</button>
                <button onclick="press('3')">3</button>

                <button onclick="press('4')">4</button>
                <button onclick="press('5')">5</button>
                <button onclick="press('6')">6</button>

                <button onclick="press('7')">7</button>
                <button onclick="press('8')">8</button>
                <button onclick="press('9')">9</button>

                <button onclick="press('0')">0</button>
                <button onclick="backspace()">⌫</button>
                <button onclick="closeKeypad()">✕</button>

                <button class="open" onclick="checkCode()">
                    ОТКРЫТЬ ДВЕРЬ
                </button>

            </div>

        </div>

    </div>

</div>


<script>

let code = "";
let lives = 3;


/* =========================
   ИНФОРМАЦИЯ
========================= */

function showInfo(title,text){

    document.getElementById("infoTitle").innerHTML = title;

    document.getElementById("infoText").innerHTML = text;

    document.getElementById("infoWindow").style.display = "flex";
}


function closeInfo(){

    document.getElementById("infoWindow").style.display = "none";
}


/* =========================
   ПОДСКАЗКА
========================= */

function showHint(){

    showInfo(
        "💡 ПОДСКАЗКА",
        "Осмотри предметы в комнате:<br><br>" +
        "🖼 Картина → <b>7</b><br>" +
        "🕐 Часы → <b>2</b><br>" +
        "💡 Лампа → <b>9</b><br>" +
        "📝 Записка → <b>4</b><br><br>" +
        "Код двери: <b>7294</b>"
    );
}


/* =========================
   КЛАВИАТУРА
========================= */

function openKeypad(){

    code = "";

    updateDisplay();

    document.getElementById("keypadWindow").style.display = "flex";
}


function closeKeypad(){

    document.getElementById("keypadWindow").style.display = "none";
}


function press(number){

    if(code.length >= 4) return;

    code += number;

    updateDisplay();
}


function backspace(){

    code = code.slice(0,-1);

    updateDisplay();
}


function updateDisplay(){

    let result = code;

    while(result.length < 4){
        result += "_";
    }

    document.getElementById("display").textContent = result;
}


/* =========================
   ПРОВЕРКА
========================= */

function checkCode(){

    if(code === "7294"){

        closeKeypad();

        showInfo(
            "🔓 ДВЕРЬ ОТКРЫТА",
            "Код <b>7294</b> правильный!<br><br>" +
            "<b>УРОВЕНЬ ПРОЙДЕН!</b>"
        );

        return;
    }


    lives--;

    document.getElementById("lives").textContent =
        "❤️".repeat(lives) +
        "🖤".repeat(3-lives);

    code = "";

    updateDisplay();


    if(lives <= 0){

        closeKeypad();

        showInfo(
            "ИГРА ОКОНЧЕНА",
            "Ты использовал все 3 попытки.<br><br>" +
            "Перезапусти уровень и попробуй снова."
        );

    }else{

        showInfo(
            "❌ НЕВЕРНЫЙ КОД",
            "Код неправильный.<br><br>" +
            "Осталось жизней: <b>" +
            lives +
            "</b>"
        );

    }
}

</script>

</body>
</html>
