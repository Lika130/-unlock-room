<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>РАЗБЛОКИРУЙ — Уровень 1</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#080604;
}

body{
 display:flex;
 justify-content:center;
 font-family:Arial,sans-serif;
}

#game{
 position:relative;
 width:min(100vw,520px);
 height:100vh;
 overflow:hidden;
 background:#080604;
}

/* РЕАЛИСТИЧНАЯ КОМНАТА */
.scene{
 position:absolute;
 inset:0;
 background:
 url("room.jpg")
 center center/
 cover no-repeat;
}

/* ВЕРХ */
.header{
 position:absolute;
 z-index:20;
 top:0;
 left:0;
 right:0;
 height:88px;
 padding:12px 14px;
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.back{
 width:56px;
 height:56px;
 border-radius:17px;
 border:2px solid #d2b574;
 background:rgba(10,7,4,.85);
 color:white;
 font-size:32px;
 box-shadow:0 4px 15px #000;
}

.level{
 padding:12px 22px;
 border:2px solid #936a30;
 border-radius:22px;
 background:rgba(20,10,4,.88);
 color:#f4d48e;
 font-size:19px;
 font-weight:900;
 box-shadow:0 5px 20px #000;
}

.hearts{
 font-size:22px;
 letter-spacing:-4px;
 text-shadow:0 2px 5px #000;
}

/* НЕВИДИМЫЕ КНОПКИ НА ПРЕДМЕТАХ */
.hot{
 position:absolute;
 z-index:10;
 border:0;
 background:transparent;
 cursor:pointer;
}

/* КАРТИНА */
#picture{
 left:0;
 top:24%;
 width:25%;
 height:29%;
}

/* ЧАСЫ */
#clock{
 right:0;
 top:20%;
 width:25%;
 height:20%;
}

/* ЗАПИСКА */
#note{
 left:2%;
 bottom:24%;
 width:28%;
 height:19%;
}

/* ЛАМПА */
#lamp{
 left:0;
 bottom:27%;
 width:25%;
 height:21%;
}

/* КОДОВАЯ ПАНЕЛЬ */
#keypad{
 right:10%;
 top:38%;
 width:21%;
 height:29%;
}

/* НИЖНЯЯ ПАНЕЛЬ */
.bottom{
 position:absolute;
 z-index:20;
 bottom:0;
 left:0;
 right:0;
 height:112px;
 padding:12px 18px;
 display:flex;
 align-items:flex-end;
 justify-content:space-between;
 background:
 linear-gradient(
 transparent,
 rgba(5,3,2,.97) 60%
 );
}

.slot,
.hint{
 height:55px;
 border:2px solid #805b27;
 background:rgba(16,9,4,.92);
 border-radius:15px;
 color:#f5d58d;
 box-shadow:0 4px 15px #000;
}

.slot{
 width:55px;
 font-size:23px;
}

.hint{
 padding:0 17px;
 font-weight:900;
}

/* ОКНА */
.modalbg{
 position:absolute;
 z-index:100;
 inset:0;
 background:rgba(0,0,0,.8);
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.modal{
 width:min(92%,390px);
 background:
 linear-gradient(#28170c,#0d0805);
 border:2px solid #b9873d;
 border-radius:20px;
 padding:20px;
 text-align:center;
 color:white;
 box-shadow:0 20px 70px #000;
}

.modal h2{
 margin:0 0 10px;
 color:#f5d38a;
}

.modal p{
 line-height:1.5;
}

.btn{
 margin-top:10px;
 padding:12px 22px;
 border-radius:12px;
 border:1px solid #bb8b42;
 background:#1a0f08;
 color:white;
 font-weight:900;
}

/* ДИСПЛЕЙ ЗАМКА */
.display{
 height:48px;
 background:#061007;
 border:1px solid #78945f;
 border-radius:8px;
 color:#a8e88a;
 display:flex;
 align-items:center;
 justify-content:center;
 font:700 23px monospace;
 letter-spacing:7px;
 margin:12px 0;
}

.pad{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
}

.key{
 padding:12px;
 border-radius:9px;
 background:#25150b;
 border:1px solid #93672d;
 color:white;
 font-size:18px;
}

/* ПОБЕДА */
.win{
 position:absolute;
 z-index:120;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:rgba(0,0,0,.9);
 color:white;
}

.win h1{
 color:#f6d38a;
 font-size:34px;
}

.next{
 display:inline-block;
 padding:14px 26px;
 border-radius:13px;
 background:
 linear-gradient(#f6cd67,#aa6d18);
 color:#160c04;
 font-weight:900;
}
</style>
</head>

<body>

<div id="game">

<!-- РЕАЛИСТИЧНЫЙ ФОН -->
<div class="scene"></div>

<!-- ШАПКА -->
<div class="header">

<button class="back"
onclick="location.href='index.html'">
‹
</button>

<div class="level">
УРОВЕНЬ 1 / 100
</div>

<div class="hearts" id="hearts">
❤️❤️❤️
</div>

</div>


<!-- ИНТЕРАКТИВНЫЕ ПРЕДМЕТЫ -->

<button
id="picture"
class="hot"
onclick="inspect('picture')">
</button>

<button
id="clock"
class="hot"
onclick="inspect('clock')">
</button>

<button
id="note"
class="hot"
onclick="inspect('note')">
</button>

<button
id="lamp"
class="hot"
onclick="inspect('lamp')">
</button>

<button
id="keypad"
class="hot"
onclick="openPad()">
</button>


<!-- НИЗ -->

<div class="bottom">

<button class="slot">
🎒
</button>

<button class="slot" id="i1"></button>

<button class="slot" id="i2"></button>

<button class="slot" id="i3"></button>

<button class="hint"
onclick="hint()">
💡 ПОДСКАЗКА
</button>

</div>


<!-- ИНФОРМАЦИЯ -->

<div class="modalbg" id="info">

<div class="modal">

<h2 id="mh"></h2>

<p id="mp"></p>

<button
class="btn"
onclick="closeInfo()">
ПОНЯТНО
</button>

</div>

</div>


<!-- ЗАМОК -->

<div class="modalbg" id="padm">

<div class="modal">

<h2>
Электронный замок
</h2>

<div
class="display"
id="display">
----
</div>

<div
class="pad"
id="pad">
</div>

<button
class="btn"
onclick="closePad()">
ЗАКРЫТЬ
</button>

</div>

</div>


<!-- ПОБЕДА -->

<div
class="win"
id="win">

<div>

<div style="font-size:70px">
🔓
</div>

<h1>
УРОВЕНЬ ПРОЙДЕН!
</h1>

<p>
Дверь открыта.
</p>

<div class="next">
УРОВЕНЬ 2 →
</div>

</div>

</div>

</div>


<script>

let lives=3;
let code="";

const correct="7294";


function info(title,text){

 document.getElementById("mh")
 .textContent=title;

 document.getElementById("mp")
 .innerHTML=text;

 document.getElementById("info")
 .style.display="flex";
}


function closeInfo(){

 document.getElementById("info")
 .style.display="none";

}


function inspect(type){

 if(type==="picture"){

  info(
   "Картина",
   "За рамой спрятана первая цифра: <b>7</b>."
  );

 }

 if(type==="clock"){

  info(
   "Старинные часы",
   "Часы остановились на <b>2</b>."
  );

 }

 if(type==="lamp"){

  info(
   "Лампа",
   "На основании выгравировано <b>9</b>."
  );

 }

 if(type==="note"){

  info(
   "Старая записка",
   "«Порядок важен». Последняя цифра находится на двери: <b>4</b>.<br><br>Код: <b>7294</b>"
  );

 }

}


function hint(){

 info(
  "Подсказка",
  "Осмотри картину, часы, лампу и записку.<br><br>Цифры идут в порядке:<br><b>7 → 2 → 9 → 4</b>"
 );

}


function openPad(){

 code="";

 update();

 document.getElementById("padm")
 .style.display="flex";

}


function closePad(){

 document.getElementById("padm")
 .style.display="none";

}


function update(){

 document.getElementById("display")
 .textContent=code.padEnd(4,"-");

}


function press(number){

 if(code.length>=4)
  return;

 code+=number;

 update();

 if(code.length===4){

  setTimeout(()=>{

   if(code===correct){

    closePad();

    document.getElementById("win")
    .style.display="flex";

   }else{

    code="";

    update();

    lives--;

    document.getElementById("hearts")
    .textContent=
    "❤️".repeat(lives)+
    "🖤".repeat(3-lives);

    if(lives<=0){

     info(
      "Попытки закончились",
      "Обнови страницу, чтобы начать уровень заново."
     );

    }

   }

  },250);

 }

}


/* КНОПКИ КОДОВОЙ ПАНЕЛИ */

[
1,2,3,
4,5,6,
7,8,9,
"⌫",0
].forEach(number=>{

 let button=
 document.createElement("button");

 button.className="key";

 button.textContent=number;

 button.onclick=()=>{

  if(number==="⌫"){

   code=code.slice(0,-1);

   update();

  }else{

   press(number);

  }

 };

 document.getElementById("pad")
 .appendChild(button);

});

</script>

</body>
</html>
